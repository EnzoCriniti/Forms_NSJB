<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo funcional resumido</title>
  <desc id="desc">Sequencia simplificada entre usuario, frontend, backend e PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f3f0ea"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c4d1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="380" rx="28" fill="url(#bg2)"/>
  <text x="64" y="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#2d2418">Fluxo funcional resumido</text>
  <text x="64" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#6a5a46">Visao curta para leitura rapida da aplicacao</text>

  <rect x="72" y="146" width="210" height="102" rx="18" fill="#ffffff" stroke="#e0d3bf"/>
  <text x="177" y="186" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2d2418">Usuario</text>
  <text x="177" y="210" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6a5a46">Acesso publico ou interno</text>

  <rect x="334" y="146" width="210" height="102" rx="18" fill="#ffffff" stroke="#e0d3bf"/>
  <text x="439" y="186" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2d2418">Frontend</text>
  <text x="439" y="210" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6a5a46">Telas, modais e navegacao</text>

  <rect x="596" y="146" width="210" height="102" rx="18" fill="#ffffff" stroke="#e0d3bf"/>
  <text x="701" y="186" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2d2418">Backend</text>
  <text x="701" y="210" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6a5a46">Regras e persistencia</text>

  <rect x="858" y="134" width="280" height="126" rx="18" fill="#ffffff" stroke="#e0d3bf"/>
  <text x="998" y="176" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#2d2418">PostgreSQL</text>
  <text x="998" y="202" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6a5a46">Base oficial do ambiente</text>
  <text x="998" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#6a5a46">Docker Compose</text>

  <path d="M282 197 L334 197" stroke="#7c4d1f" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M544 197 L596 197" stroke="#7c4d1f" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M806 197 L858 197" stroke="#7c4d1f" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
</svg>
