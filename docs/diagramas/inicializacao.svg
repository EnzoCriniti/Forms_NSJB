<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de inicializacao da stack</title>
  <desc id="desc">Sequencia da subida do Docker Compose, validacao do PostgreSQL, backend e frontend com importacao unica do SQLite legado.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf4fb"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#30475e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="360" rx="28" fill="url(#bg3)"/>
  <text x="64" y="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2a37">Fluxo de inicializacao da stack</text>
  <text x="64" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6574">Subida oficial via Docker Compose com importacao unica do legado quando necessario</text>

  <rect x="74" y="138" width="180" height="98" rx="18" fill="#ffffff" stroke="#cad4e1"/>
  <text x="164" y="175" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a37">Docker</text>
  <text x="164" y="198" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#566170">compose up -d --build</text>

  <rect x="290" y="138" width="180" height="98" rx="18" fill="#ffffff" stroke="#cad4e1"/>
  <text x="380" y="175" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a37">PostgreSQL</text>
  <text x="380" y="198" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#566170">healthcheck ok</text>

  <rect x="506" y="138" width="180" height="98" rx="18" fill="#ffffff" stroke="#cad4e1"/>
  <text x="596" y="175" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a37">Backend</text>
  <text x="596" y="198" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#566170">sobe e valida o banco</text>

  <rect x="722" y="138" width="180" height="98" rx="18" fill="#fffaf6" stroke="#e6c8a9"/>
  <text x="812" y="175" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5a4631">SQLite legado</text>
  <text x="812" y="198" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#7b6753">importacao unica</text>

  <rect x="938" y="138" width="180" height="98" rx="18" fill="#ffffff" stroke="#cad4e1"/>
  <text x="1028" y="175" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a37">Frontend</text>
  <text x="1028" y="198" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#566170">fica disponivel</text>

  <path d="M254 187 L290 187" stroke="#30475e" stroke-width="4" fill="none" marker-end="url(#arrow3)"/>
  <path d="M470 187 L506 187" stroke="#30475e" stroke-width="4" fill="none" marker-end="url(#arrow3)"/>
  <path d="M686 187 L722 187" stroke="#7c8796" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrow3)"/>
  <path d="M902 187 L938 187" stroke="#30475e" stroke-width="4" fill="none" marker-end="url(#arrow3)"/>
</svg>
