<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura geral NSJB Forms</title>
  <desc id="desc">Fluxo visual entre usuario, frontend, backend, PostgreSQL e importacao unica do SQLite legado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#324152"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c8796"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="460" rx="28" fill="url(#bg)"/>
  <text x="64" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#18212f">NSJB Forms</text>
  <text x="64" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6574">Arquitetura oficial em Docker com PostgreSQL como banco principal</text>

  <rect x="70" y="160" width="245" height="138" rx="20" fill="url(#card)" stroke="#cad4e1"/>
  <text x="192.5" y="200" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2a37">Frontend</text>
  <text x="192.5" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">React + Vite</text>
  <text x="192.5" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">Interface e telas do usuario</text>

  <rect x="355" y="160" width="245" height="138" rx="20" fill="url(#card)" stroke="#cad4e1"/>
  <text x="477.5" y="200" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2a37">Backend</text>
  <text x="477.5" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">Node + API</text>
  <text x="477.5" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">Regras, validacao e persistencia</text>

  <rect x="640" y="146" width="245" height="166" rx="20" fill="#ffffff" stroke="#cad4e1"/>
  <text x="762.5" y="188" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2a37">PostgreSQL</text>
  <text x="762.5" y="218" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">Banco oficial do Docker</text>
  <text x="762.5" y="240" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">Fonte unica de dados</text>
  <text x="762.5" y="262" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#566170">Volume persistente</text>

  <rect x="925" y="160" width="245" height="138" rx="20" fill="#fffaf6" stroke="#e6c8a9"/>
  <text x="1047.5" y="200" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#5a4631">SQLite legado</text>
  <text x="1047.5" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#7b6753">Importacao unica</text>
  <text x="1047.5" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#7b6753">Fora do fluxo oficial</text>

  <path d="M315 229 L355 229" stroke="#324152" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 229 L640 229" stroke="#324152" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M885 229 L925 229" stroke="#7c8796" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowSoft)"/>

  <text x="335" y="208" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5f6b79">HTTP</text>
  <text x="620" y="208" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5f6b79">repositorios</text>
  <text x="905" y="208" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#7c8796">migração unica</text>
</svg>
